defaults:
  - trainer: flux
  - model: flux_lora
  - writer: console
  - transforms: only_instance
  - ddp: accelerate
  - lr_scheduler: constant
  - pipeline: flux
  - metrics: all_metrics
  - datasets: all_datasets
  - dataloaders: all_dataloaders
  - _self_

optimizer:
  _convert_: partial
  _target_: torch.optim.AdamW
  weight_decay: 0

writer:
  loss_names: ["loss", "mse"]

loss_function:
  _target_: src.loss.flux_loss.FluxFlowMatchLoss

lr_for_lora: 1.0
gradient_accumulation_steps: 1

train_dataset_name: "dreambooth"
val_datasets_names: ["db_liv_small"]

inference_metrics: ["dino", "clip_ts"]

collate_fn_train: src.datasets.collate.collate_fn
collate_fn_val: src.datasets.collate.collate_fn_val

exp_namer: src.utils.exp_namers.from_config

validation_args:
  num_images_per_prompt: 5
  num_inference_steps: 28
  guidance_scale: 3.5
  height: 1024
  width: 1024
  max_sequence_length: 512
