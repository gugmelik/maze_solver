# LoRA on Qwen-Image-Edit-2511, 5x5 mazes, single RTX A5000 (24 GB).
# Same task, same metrics, same reports as configs/flux_kontext.yaml -- so the
# two runs are directly comparable. Differences from FLUX, and why:
#
#   * 20B DiT instead of 12B      -> ~12 GB in NF4 rather than ~7 GB
#   * the text encoder is a VLM   -> Qwen2.5-VL sees each maze, so its prompt
#                                    embedding cannot be cached once. It stays
#                                    resident in 4-bit (~4 GB) during training.
#   * no distilled guidance       -> guidance_scale is ignored at train time;
#                                    evaluation uses true CFG instead.
#
# That puts VRAM at roughly 18-21 GB. Watch train/vram_gb on the first run, and
# if it is close to the limit, free the card of anything else first.

backend: qwen_edit
data:    data/maze5
cache:   cache/maze5       # latents live under cache/maze5/qwen_edit/
output:  outputs/qwen_edit

model_id:     Qwen/Qwen-Image-Edit-2511
quantization: nf4

# --- LoRA ---------------------------------------------------------------
# Targets default to both attention streams (image to_* and text add_*_proj).
# Leave lora_targets unset to use that; set it to override.
lora_rank:    16
lora_alpha:   16
lora_dropout: 0.0

# --- optimisation -------------------------------------------------------
max_steps:    6000
batch_size:   1            # the 20B DiT leaves little room; keep this at 1
grad_accum:   4
lr:           1.0e-4
lr_scheduler: constant_with_warmup
warmup_steps: 100
max_grad_norm: 1.0
gradient_checkpointing: true

weighting_scheme: logit_normal
logit_mean:  0.0
logit_std:   1.0
mode_scale:  1.29

seed: 0
num_workers: 4             # these workers also decode the VLM condition images

# --- logging / checkpointing -------------------------------------------
save_every:     1000
validate_every: 1000
validate_n:     16
validate_steps: 20
validate_guidance: 4.0     # true-CFG scale; 1.0 disables CFG and halves eval cost
log_every:      10

wandb:         true
wandb_project: maze-diff-reasoning
